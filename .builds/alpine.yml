image: alpine/latest
packages:
  - cargo
  - rust
  - zstd
  - fuse3
  - fuse3-dev
sources:
  - https://github.com/realchonk/fuse-ufs
tasks:
  - prepare: |
      sudo modprobe fuse
      sudo cp fuse-ufs/.builds/fuse.conf /etc/fuse.conf
      sudo chmod 666 /dev/fuse
  - test: |
      cd fuse-ufs
      SUDO=sudo RUST_BACKTRACE=1 make test
